<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Gyro Cuts - XR Edition</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #090214; 
            cursor: crosshair; 
            touch-action: none; 
            -webkit-user-select: none; /* Prevents text selection on long press */
        }
        canvas { 
            display: block; 
        }
        #instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.8);
            font-family: monospace;
            pointer-events: none;
            user-select: none;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #FE53BB;
            line-height: 1.5;
            text-transform: uppercase;
        }
        .key {
            background: #08F7FE;
            color: #000;
            padding: 2px 6px;
            border-radius: 2px;
            font-weight: bold;
        }
        #sensor-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 30px;
            font-size: 18px;
            font-family: monospace;
            text-transform: uppercase;
            background: #090214;
            color: #08F7FE;
            border: 2px solid #08F7FE;
            box-shadow: 0 0 10px #08F7FE;
            cursor: pointer;
            z-index: 100;
        }
    </style>
</head>
<body>

    <button id="sensor-btn">Enable XR Sensors</button>

    <div id="instructions">
        Target: Cyber-Mesh<br>
        Gravity: Tilt Device<br>
        Action: Multi-Touch Slice<br>
        System: Shake Phone to Reboot
    </div>
    
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const points = [];
        let links = [];

        let gravityX = 0;
        let gravityY = 0.35; 

        // Multi-touch tracking dictionary
        const activeTouches = {};
        // Mouse fallback for PC testing
        const mouse = { x: 0, y: 0, oldX: 0, oldY: 0, isDown: false };

        // --- SENSOR PERMISSIONS (Required for iPhone XR) ---
        const sensorBtn = document.getElementById('sensor-btn');
        
        sensorBtn.addEventListener('click', () => {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                            window.addEventListener('devicemotion', handleMotion);
                            sensorBtn.style.display = 'none'; 
                        } else {
                            alert("Sensors are required for full features.");
                        }
                    })
                    .catch(console.error);
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
                window.addEventListener('devicemotion', handleMotion);
                sensorBtn.style.display = 'none';
            }
        });

        // 1. Gyroscope: Calculate gravity based on device tilt
        function handleOrientation(event) {
            let beta = event.beta;  
            let gamma = event.gamma; 
            if (beta === null || gamma === null) return;

            const maxTilt = 45;
            beta = Math.max(-maxTilt, Math.min(maxTilt, beta));
            gamma = Math.max(-maxTilt, Math.min(maxTilt, gamma));

            gravityX = (gamma / maxTilt) * 0.4;
            gravityY = (beta / maxTilt) * 0.4;
        }

        // 2. Accelerometer: Shake to Reset
        let lastX = null, lastY = null, lastZ = null;
        let lastShakeTime = 0;

        function handleMotion(event) {
            let acc = event.accelerationIncludingGravity;
            if (!acc || acc.x === null) return;

            if (lastX !== null) {
                // Calculate total movement force
                let delta = Math.abs(acc.x + acc.y + acc.z - lastX - lastY - lastZ);
                
                if (delta > 25) { // Shake threshold
                    let now = Date.now();
                    if (now - lastShakeTime > 1000) { // 1-second cooldown so it doesn't trigger 100 times
                        resetStrands();
                        lastShakeTime = now;
                    }
                }
            }
            lastX = acc.x; lastY = acc.y; lastZ = acc.z;
        }

        // --- INPUT HANDLING ---

        // Multi-touch Events
        window.addEventListener('touchstart', (e) => { 
            for(let i = 0; i < e.changedTouches.length; i++) {
                let t = e.changedTouches[i];
                activeTouches[t.identifier] = { 
                    x: t.clientX, y: t.clientY, 
                    oldX: t.clientX, oldY: t.clientY 
                };
            }
        }, {passive: false});

        window.addEventListener('touchmove', (e) => {
            e.preventDefault(); // Prevents iOS scroll bouncing
            for(let i = 0; i < e.changedTouches.length; i++) {
                let t = e.changedTouches[i];
                let touchObj = activeTouches[t.identifier];
                if (touchObj) {
                    touchObj.oldX = touchObj.x; 
                    touchObj.oldY = touchObj.y;
                    touchObj.x = t.clientX;     
                    touchObj.y = t.clientY;
                    cutStrands(touchObj.oldX, touchObj.oldY, touchObj.x, touchObj.y);
                }
            }
        }, {passive: false});

        window.addEventListener('touchend', (e) => {
            for(let i = 0; i < e.changedTouches.length; i++) {
                delete activeTouches[e.changedTouches[i].identifier];
            }
        });
        
        window.addEventListener('touchcancel', (e) => {
            for(let i = 0; i < e.changedTouches.length; i++) {
                delete activeTouches[e.changedTouches[i].identifier];
            }
        });

        // Mouse fallback
        window.addEventListener('mousedown', (e) => {
            mouse.x = e.clientX; mouse.y = e.clientY;
            mouse.oldX = mouse.x; mouse.oldY = mouse.y;
            mouse.isDown = true;
        });
        window.addEventListener('mousemove', (e) => {
            if (mouse.isDown) {
                mouse.oldX = mouse.x; mouse.oldY = mouse.y;
                mouse.x = e.clientX; mouse.y = e.clientY;
                cutStrands(mouse.oldX, mouse.oldY, mouse.x, mouse.y);
            }
        });
        window.addEventListener('mouseup', () => mouse.isDown = false);
        window.addEventListener('keydown', (e) => { if (e.key.toLowerCase() === 'r') resetStrands(); });

        const cyberColors = ['#08F7FE', '#FE53BB', '#F5D300'];

        // --- GAME SETUP ---
        function initStrands() {
            const cols = Math.floor(canvas.width / 15); 
            const rows = 40;  
            const spacing = 12; 
            
            const startX = (canvas.width / 2) - ((cols * spacing) / 2);
            const startY = 40; 
            
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const isPinned = y === 0; 
                    points.push({ 
                        x: startX + x * spacing, y: startY + y * spacing, 
                        ox: startX + x * spacing, oy: startY + y * spacing, 
                        pinned: isPinned 
                    });
                }
            }

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    let index = y * cols + x;
                    let colorCode = cyberColors[(x + y) % 3];

                    if (x < cols - 1) links.push({ p1: points[index], p2: points[index + 1], length: spacing, color: colorCode });
                    if (y < rows - 1) links.push({ p1: points[index], p2: points[index + cols], length: spacing, color: colorCode });
                }
            }
        }

        function resetStrands() {
            points.length = 0; 
            links.length = 0;
            initStrands();
        }

        function intersects(a, b, c, d, p, q, r, s) {
            let det = (c - a) * (s - q) - (r - p) * (d - b);
            if (det === 0) return false;
            let lambda = ((s - q) * (r - a) + (p - r) * (s - b)) / det;
            let gamma = ((b - d) * (r - a) + (c - a) * (s - b)) / det;
            return (0 < lambda && lambda < 1) && (0 < gamma && gamma < 1);
        }

        function cutStrands(x1, y1, x2, y2) {
            let hasCutOneStrand = false; 
            links = links.filter(link => {
                if (hasCutOneStrand) return true;
                const hit = intersects(x1, y1, x2, y2, link.p1.x, link.p1.y, link.p2.x, link.p2.y);
                
                if (hit) {
                    hasCutOneStrand = true; 
                    const kickForce = 15; 
                    link.p1.ox -= (Math.random() - 0.5) * kickForce;
                    link.p2.ox -= (Math.random() - 0.5) * kickForce;
                    link.p1.oy += Math.random() * (kickForce * 0.8);
                    link.p2.oy += Math.random() * (kickForce * 0.8);
                    return false; 
                }
                return true; 
            });
        }

        // --- PHYSICS ENGINE ---
        function updatePhysics() {
            for (let p of points) {
                if (p.pinned) continue;
                let vx = (p.x - p.ox) * 0.99; 
                let vy = (p.y - p.oy) * 0.99;
                
                p.ox = p.x; p.oy = p.y;
                
                p.x += vx + gravityX;
                p.y += vy + gravityY; 
            }

            for (let i = 0; i < 3; i++) {
                for (let l of links) {
                    let dx = l.p2.x - l.p1.x;
                    let dy = l.p2.y - l.p1.y;
                    let distance = Math.hypot(dx, dy);
                    
                    let difference = (l.length - distance) / distance;
                    let offsetX = dx * difference * 0.5;
                    let offsetY = dy * difference * 0.5;

                    if (!l.p1.pinned) { l.p1.x -= offsetX; l.p1.y -= offsetY; }
                    if (!l.p2.pinned) { l.p2.x += offsetX; l.p2.y += offsetY; }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Cloth
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            for (let l of links) {
                ctx.beginPath();
                ctx.moveTo(l.p1.x, l.p1.y);
                ctx.lineTo(l.p2.x, l.p2.y);
                ctx.strokeStyle = l.color;
                ctx.stroke();
            }

            // Draw Multi-Touch Trails
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 3;
            for (let id in activeTouches) {
                let t = activeTouches[id];
                ctx.beginPath();
                ctx.moveTo(t.oldX, t.oldY);
                ctx.lineTo(t.x, t.y);
                ctx.stroke();
            }

            // Draw Mouse Trail (fallback)
            if (mouse.isDown) {
                ctx.beginPath();
                ctx.moveTo(mouse.oldX, mouse.oldY);
                ctx.lineTo(mouse.x, mouse.y);
                ctx.stroke();
            }
        }

        function loop() {
            updatePhysics();
            draw();
            requestAnimationFrame(loop);
        }

        initStrands();
        loop();

    </script>
</body>
</html>
