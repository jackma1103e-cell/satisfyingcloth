<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Cloth Cuts</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            /* Deep, dark synthwave background */
            background-color: #090214; 
            cursor: crosshair; 
        }
        canvas { 
            display: block; 
        }
        #instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.8);
            font-family: monospace;
            pointer-events: none;
            user-select: none;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #FE53BB;
            line-height: 1.5;
            text-transform: uppercase;
        }
        .key {
            background: #08F7FE;
            color: #000;
            padding: 2px 6px;
            border-radius: 2px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="instructions">
        Target: Interconnected Grid<br>
        Action: Precision Snip (1 Thread/Frame)<br>
        Input: Mouse Drag<br>
        System: Press <span class="key">R</span> to Reboot Mesh
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const points = [];
        let links = [];

        const mouse = { x: 0, y: 0, oldX: 0, oldY: 0, isDown: false };

        window.addEventListener('mousedown', (e) => {
            mouse.x = e.clientX; mouse.y = e.clientY;
            mouse.oldX = mouse.x; mouse.oldY = mouse.y;
            mouse.isDown = true;
        });
        
        window.addEventListener('mousemove', (e) => {
            if (mouse.isDown) {
                mouse.oldX = mouse.x; mouse.oldY = mouse.y;
                mouse.x = e.clientX; mouse.y = e.clientY;
                cutStrands(mouse.oldX, mouse.oldY, mouse.x, mouse.y);
            }
        });

        window.addEventListener('mouseup', () => mouse.isDown = false);
        
        window.addEventListener('touchstart', (e) => { mouse.isDown = true; mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; });
        window.addEventListener('touchmove', (e) => {
            if (mouse.isDown) {
                mouse.oldX = mouse.x; mouse.oldY = mouse.y;
                mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY;
                cutStrands(mouse.oldX, mouse.oldY, mouse.x, mouse.y);
            }
        });
        window.addEventListener('touchend', () => mouse.isDown = false);

        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'r') {
                resetStrands();
            }
        });

        // --- CYBERPUNK PALETTE ---
        // 3 strict colors: Neon Cyan, Hot Magenta, Neon Yellow
        const cyberColors = ['#08F7FE', '#FE53BB', '#F5D300'];

        // --- GAME SETUP ---
        function initStrands() {
            const cols = 50;  // X strings
            const rows = 40;  // Y strings
            const spacing = 12; // Gap between points
            
            // Center the cloth on the screen
            const startX = (canvas.width / 2) - ((cols * spacing) / 2);
            const startY = 40; 
            
            // 1. Create the grid of points
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const isPinned = y === 0; // Pin the top row
                    points.push({ 
                        x: startX + x * spacing, 
                        y: startY + y * spacing, 
                        ox: startX + x * spacing, 
                        oy: startY + y * spacing, 
                        pinned: isPinned 
                    });
                }
            }

            // 2. Connect the points with X and Y strings
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    let index = y * cols + x;
                    
                    // Assign colors in a repeating sequence
                    let colorCode = cyberColors[(x + y) % 3];

                    // Connect right (X strings)
                    if (x < cols - 1) {
                        links.push({ p1: points[index], p2: points[index + 1], length: spacing, color: colorCode });
                    }
                    // Connect down (Y strings)
                    if (y < rows - 1) {
                        links.push({ p1: points[index], p2: points[index + cols], length: spacing, color: colorCode });
                    }
                }
            }
        }

        function resetStrands() {
            points.length = 0; 
            links.length = 0;
            initStrands();
        }

        // --- MATH: Line Intersection ---
        function intersects(a, b, c, d, p, q, r, s) {
            let det = (c - a) * (s - q) - (r - p) * (d - b);
            if (det === 0) return false;
            let lambda = ((s - q) * (r - a) + (p - r) * (s - b)) / det;
            let gamma = ((b - d) * (r - a) + (c - a) * (s - b)) / det;
            return (0 < lambda && lambda < 1) && (0 < gamma && gamma < 1);
        }

        // --- SLICE LOGIC ---
        function cutStrands(x1, y1, x2, y2) {
            let hasCutOneStrand = false; // Tracks if we have already cut a thread this frame

            links = links.filter(link => {
                // If we already snipped one strand this swipe frame, keep the rest intact
                if (hasCutOneStrand) return true;

                const hit = intersects(x1, y1, x2, y2, link.p1.x, link.p1.y, link.p2.x, link.p2.y);
                
                if (hit) {
                    hasCutOneStrand = true; // Lock out any further cuts for this specific mouse movement

                    const kickForce = 15; 
                    
                    // Random horizontal sway
                    link.p1.ox -= (Math.random() - 0.5) * kickForce;
                    link.p2.ox -= (Math.random() - 0.5) * kickForce;
                    
                    // Upward bounce simulating tension snap
                    link.p1.oy += Math.random() * (kickForce * 0.8);
                    link.p2.oy += Math.random() * (kickForce * 0.8);
                    
                    return false; // Break this specific link
                }
                return true; 
            });
        }

        // --- PHYSICS ENGINE ---
        function updatePhysics() {
            // 1. Move points
            for (let p of points) {
                if (p.pinned) continue;
                
                let vx = (p.x - p.ox) * 0.99; 
                let vy = (p.y - p.oy) * 0.99;
                
                p.ox = p.x;
                p.oy = p.y;
                
                p.x += vx;
                p.y += vy + 0.35; // Standard gravity
            }

            // 2. Satisfy links (Runs multiple times to keep the cloth stiff)
            for (let i = 0; i < 3; i++) {
                for (let l of links) {
                    let dx = l.p2.x - l.p1.x;
                    let dy = l.p2.y - l.p1.y;
                    let distance = Math.hypot(dx, dy);
                    
                    let difference = (l.length - distance) / distance;
                    let offsetX = dx * difference * 0.5;
                    let offsetY = dy * difference * 0.5;

                    if (!l.p1.pinned) { l.p1.x -= offsetX; l.p1.y -= offsetY; }
                    if (!l.p2.pinned) { l.p2.x += offsetX; l.p2.y += offsetY; }
                }
            }
        }

        // --- RENDER LOOP ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw the cloth matrix
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            for (let l of links) {
                ctx.beginPath();
                ctx.moveTo(l.p1.x, l.p1.y);
                ctx.lineTo(l.p2.x, l.p2.y);
                ctx.strokeStyle = l.color;
                ctx.stroke();
            }

            // Draw the slicing laser (mouse trail)
            if (mouse.isDown) {
                ctx.beginPath();
                ctx.moveTo(mouse.oldX, mouse.oldY);
                ctx.lineTo(mouse.x, mouse.y);
                // Make the cutting tool look like a neon laser
                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = 3;
                ctx.stroke();
            }
        }

        function loop() {
            updatePhysics();
            draw();
            requestAnimationFrame(loop);
        }

        // Initialize and Start
        initStrands();
        loop();

    </script>
</body>
</html>
