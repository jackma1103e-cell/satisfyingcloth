<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Gyro Cuts</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #090214; 
            cursor: crosshair; 
            /* Prevent scrolling/bouncing on iOS */
            touch-action: none; 
        }
        canvas { 
            display: block; 
        }
        #instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.8);
            font-family: monospace;
            pointer-events: none;
            user-select: none;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #FE53BB;
            line-height: 1.5;
            text-transform: uppercase;
        }
        .key {
            background: #08F7FE;
            color: #000;
            padding: 2px 6px;
            border-radius: 2px;
            font-weight: bold;
        }
        /* iOS Permission Button */
        #sensor-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 30px;
            font-size: 18px;
            font-family: monospace;
            text-transform: uppercase;
            background: #090214;
            color: #08F7FE;
            border: 2px solid #08F7FE;
            box-shadow: 0 0 10px #08F7FE;
            cursor: pointer;
            z-index: 100;
        }
    </style>
</head>
<body>

    <button id="sensor-btn">Enable Gyro Gravity</button>

    <div id="instructions">
        Target: Cyber-Mesh<br>
        Gravity: Tilt Device<br>
        System: Press <span class="key">R</span> or Tap Top Corner to Reboot
    </div>
    
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const points = [];
        let links = [];

        // Dynamic Gravity Variables
        let gravityX = 0;
        let gravityY = 0.35; // Default downward gravity before sensors kick in

        const mouse = { x: 0, y: 0, oldX: 0, oldY: 0, isDown: false };

        // --- SENSOR PERMISSIONS (Required for iPhone XR) ---
        const sensorBtn = document.getElementById('sensor-btn');
        
        sensorBtn.addEventListener('click', () => {
            // Check if iOS 13+ device orientation permission is needed
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                            sensorBtn.style.display = 'none'; // Hide button on success
                        } else {
                            alert("Gyroscope access is required for gravity controls.");
                        }
                    })
                    .catch(console.error);
            } else {
                // Non-iOS devices usually don't need explicit permission
                window.addEventListener('deviceorientation', handleOrientation);
                sensorBtn.style.display = 'none';
            }
        });

        // Calculate gravity based on device tilt
        function handleOrientation(event) {
            // Beta is front-to-back tilt (-180 to 180)
            // Gamma is left-to-right tilt (-90 to 90)
            let beta = event.beta;  
            let gamma = event.gamma; 

            if (beta === null || gamma === null) return;

            // Constrain extreme angles to prevent physics glitches
            const maxTilt = 45;
            beta = Math.max(-maxTilt, Math.min(maxTilt, beta));
            gamma = Math.max(-maxTilt, Math.min(maxTilt, gamma));

            // Map the degrees to a gravity force
            gravityX = (gamma / maxTilt) * 0.4;
            gravityY = (beta / maxTilt) * 0.4;
        }

        // --- INPUT HANDLING ---
        window.addEventListener('mousedown', (e) => {
            mouse.x = e.clientX; mouse.y = e.clientY;
            mouse.oldX = mouse.x; mouse.oldY = mouse.y;
            mouse.isDown = true;
        });
        
        window.addEventListener('mousemove', (e) => {
            if (mouse.isDown) {
                mouse.oldX = mouse.x; mouse.oldY = mouse.y;
                mouse.x = e.clientX; mouse.y = e.clientY;
                cutStrands(mouse.oldX, mouse.oldY, mouse.x, mouse.y);
            }
        });

        window.addEventListener('mouseup', () => mouse.isDown = false);
        
        // Touch support optimized for mobile
        window.addEventListener('touchstart', (e) => { 
            mouse.isDown = true; 
            mouse.x = e.touches[0].clientX; 
            mouse.y = e.touches[0].clientY; 

            // Secret mobile reset: Tap the top-right corner to reset the mesh
            if (mouse.y < 80 && mouse.x > canvas.width - 80) {
                resetStrands();
            }
        });
        window.addEventListener('touchmove', (e) => {
            if (mouse.isDown) {
                mouse.oldX = mouse.x; mouse.oldY = mouse.y;
                mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY;
                cutStrands(mouse.oldX, mouse.oldY, mouse.x, mouse.y);
            }
        });
        window.addEventListener('touchend', () => mouse.isDown = false);

        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'r') {
                resetStrands();
            }
        });

        const cyberColors = ['#08F7FE', '#FE53BB', '#F5D300'];

        // --- GAME SETUP ---
        function initStrands() {
            // Adjusted for phone screen widths
            const cols = Math.floor(canvas.width / 15); 
            const rows = 40;  
            const spacing = 12; 
            
            const startX = (canvas.width / 2) - ((cols * spacing) / 2);
            const startY = 40; 
            
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const isPinned = y === 0; 
                    points.push({ 
                        x: startX + x * spacing, 
                        y: startY + y * spacing, 
                        ox: startX + x * spacing, 
                        oy: startY + y * spacing, 
                        pinned: isPinned 
                    });
                }
            }

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    let index = y * cols + x;
                    let colorCode = cyberColors[(x + y) % 3];

                    if (x < cols - 1) {
                        links.push({ p1: points[index], p2: points[index + 1], length: spacing, color: colorCode });
                    }
                    if (y < rows - 1) {
                        links.push({ p1: points[index], p2: points[index + cols], length: spacing, color: colorCode });
                    }
                }
            }
        }

        function resetStrands() {
            points.length = 0; 
            links.length = 0;
            initStrands();
        }

        function intersects(a, b, c, d, p, q, r, s) {
            let det = (c - a) * (s - q) - (r - p) * (d - b);
            if (det === 0) return false;
            let lambda = ((s - q) * (r - a) + (p - r) * (s - b)) / det;
            let gamma = ((b - d) * (r - a) + (c - a) * (s - b)) / det;
            return (0 < lambda && lambda < 1) && (0 < gamma && gamma < 1);
        }

        function cutStrands(x1, y1, x2, y2) {
            let hasCutOneStrand = false; 

            links = links.filter(link => {
                if (hasCutOneStrand) return true;

                const hit = intersects(x1, y1, x2, y2, link.p1.x, link.p1.y, link.p2.x, link.p2.y);
                
                if (hit) {
                    hasCutOneStrand = true; 

                    const kickForce = 15; 
                    link.p1.ox -= (Math.random() - 0.5) * kickForce;
                    link.p2.ox -= (Math.random() - 0.5) * kickForce;
                    link.p1.oy += Math.random() * (kickForce * 0.8);
                    link.p2.oy += Math.random() * (kickForce * 0.8);
                    
                    return false; 
                }
                return true; 
            });
        }

        // --- PHYSICS ENGINE ---
        function updatePhysics() {
            for (let p of points) {
                if (p.pinned) continue;
                
                let vx = (p.x - p.ox) * 0.99; 
                let vy = (p.y - p.oy) * 0.99;
                
                p.ox = p.x;
                p.oy = p.y;
                
                // Add the dynamic gravity from the gyroscope
                p.x += vx + gravityX;
                p.y += vy + gravityY; 
            }

            for (let i = 0; i < 3; i++) {
                for (let l of links) {
                    let dx = l.p2.x - l.p1.x;
                    let dy = l.p2.y - l.p1.y;
                    let distance = Math.hypot(dx, dy);
                    
                    let difference = (l.length - distance) / distance;
                    let offsetX = dx * difference * 0.5;
                    let offsetY = dy * difference * 0.5;

                    if (!l.p1.pinned) { l.p1.x -= offsetX; l.p1.y -= offsetY; }
                    if (!l.p2.pinned) { l.p2.x += offsetX; l.p2.y += offsetY; }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            for (let l of links) {
                ctx.beginPath();
                ctx.moveTo(l.p1.x, l.p1.y);
                ctx.lineTo(l.p2.x, l.p2.y);
                ctx.strokeStyle = l.color;
                ctx.stroke();
            }

            if (mouse.isDown) {
                ctx.beginPath();
                ctx.moveTo(mouse.oldX, mouse.oldY);
                ctx.lineTo(mouse.x, mouse.y);
                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = 3;
                ctx.stroke();
            }
        }

        function loop() {
            updatePhysics();
            draw();
            requestAnimationFrame(loop);
        }

        initStrands();
        loop();

    </script>
</body>
</html>
