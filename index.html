<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satisfying Rainbow Cuts</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #121212; 
            cursor: crosshair; 
        }
        canvas { 
            display: block; 
        }
        #instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.8);
            font-family: sans-serif;
            pointer-events: none;
            user-select: none;
            background: rgba(0, 0, 0, 0.5);
            padding: 12px;
            border-radius: 8px;
            line-height: 1.5;
        }
        .key {
            background: #fff;
            color: #000;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="instructions">
        Click and drag to cut the rainbow strands.<br>
        Press <span class="key">R</span> to replace the curtain.
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Resize canvas to fill the screen
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Physics Arrays
        const points = [];
        let links = [];

        // Mouse interaction tracking
        const mouse = { x: 0, y: 0, oldX: 0, oldY: 0, isDown: false };

        window.addEventListener('mousedown', (e) => {
            mouse.x = e.clientX; mouse.y = e.clientY;
            mouse.oldX = mouse.x; mouse.oldY = mouse.y;
            mouse.isDown = true;
        });
        
        window.addEventListener('mousemove', (e) => {
            if (mouse.isDown) {
                mouse.oldX = mouse.x; mouse.oldY = mouse.y;
                mouse.x = e.clientX; mouse.y = e.clientY;
                cutStrands(mouse.oldX, mouse.oldY, mouse.x, mouse.y);
            }
        });

        window.addEventListener('mouseup', () => mouse.isDown = false);
        
        // Touch support
        window.addEventListener('touchstart', (e) => { mouse.isDown = true; mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; });
        window.addEventListener('touchmove', (e) => {
            if (mouse.isDown) {
                mouse.oldX = mouse.x; mouse.oldY = mouse.y;
                mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY;
                cutStrands(mouse.oldX, mouse.oldY, mouse.x, mouse.y);
            }
        });
        window.addEventListener('touchend', () => mouse.isDown = false);

        // Keyboard support for Reset
        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'r') {
                resetStrands();
            }
        });

        // --- GAME SETUP ---
        function initStrands() {
            const gapX = 8;  // INCREASED DENSITY: Distance between strands is smaller
            const gapY = 10; // Length of each link
            const rows = 45; // How long the strands are
            
            // Create a curtain of strands
            for (let x = 30; x < canvas.width - 30; x += gapX) {
                const hue = (x / canvas.width) * 360; 
                const color = `hsl(${hue}, 100%, 60%)`;
                
                let prevPoint = null;
                for (let y = 0; y < rows; y++) {
                    const isPinned = y === 0; 
                    const p = { 
                        x: x, y: y * gapY, 
                        ox: x, oy: y * gapY, 
                        pinned: isPinned, 
                        color: color 
                    };
                    points.push(p);
                    
                    if (prevPoint) {
                        links.push({ p1: prevPoint, p2: p, length: gapY, color: color });
                    }
                    prevPoint = p;
                }
            }
        }

        function resetStrands() {
            // Empty the physics arrays completely
            points.length = 0; 
            links.length = 0;
            // Rebuild
            initStrands();
        }

        // --- MATH: Line Intersection ---
        function intersects(a, b, c, d, p, q, r, s) {
            let det = (c - a) * (s - q) - (r - p) * (d - b);
            if (det === 0) return false;
            let lambda = ((s - q) * (r - a) + (p - r) * (s - b)) / det;
            let gamma = ((b - d) * (r - a) + (c - a) * (s - b)) / det;
            return (0 < lambda && lambda < 1) && (0 < gamma && gamma < 1);
        }

        // Slice logic
        function cutStrands(x1, y1, x2, y2) {
            links = links.filter(link => {
                const hit = intersects(x1, y1, x2, y2, link.p1.x, link.p1.y, link.p2.x, link.p2.y);
                
                if (hit) {
                    // REALISTIC SCATTER PHYSICS
                    // By altering the 'old' position (ox, oy), we create instant velocity in Verlet integration.
                    const kickForce = 12; // How hard the strands snap away
                    
                    // Random horizontal sway (left or right)
                    link.p1.ox -= (Math.random() - 0.5) * kickForce;
                    link.p2.ox -= (Math.random() - 0.5) * kickForce;
                    
                    // Upward bounce to simulate tension release
                    link.p1.oy += Math.random() * (kickForce * 0.8);
                    link.p2.oy += Math.random() * (kickForce * 0.8);
                    
                    return false; // Remove the cut link
                }
                return true; // Keep the link if untouched
            });
        }

        // --- PHYSICS ENGINE ---
        function updatePhysics() {
            // 1. Move points
            for (let p of points) {
                if (p.pinned) continue;
                
                let vx = (p.x - p.ox) * 0.99; // 0.99 adds air resistance/drag
                let vy = (p.y - p.oy) * 0.99;
                
                p.ox = p.x;
                p.oy = p.y;
                
                p.x += vx;
                p.y += vy + 0.35; // Gravity pull
            }

            // 2. Satisfy links
            for (let i = 0; i < 3; i++) {
                for (let l of links) {
                    let dx = l.p2.x - l.p1.x;
                    let dy = l.p2.y - l.p1.y;
                    let distance = Math.hypot(dx, dy);
                    
                    let difference = (l.length - distance) / distance;
                    let offsetX = dx * difference * 0.5;
                    let offsetY = dy * difference * 0.5;

                    if (!l.p1.pinned) { l.p1.x -= offsetX; l.p1.y -= offsetY; }
                    if (!l.p2.pinned) { l.p2.x += offsetX; l.p2.y += offsetY; }
                }
            }
        }

        // --- RENDER LOOP ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw the cloth
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            for (let l of links) {
                ctx.beginPath();
                ctx.moveTo(l.p1.x, l.p1.y);
                ctx.lineTo(l.p2.x, l.p2.y);
                ctx.strokeStyle = l.color;
                ctx.stroke();
            }

            // Draw the mouse slash
            if (mouse.isDown) {
                ctx.beginPath();
                ctx.moveTo(mouse.oldX, mouse.oldY);
                ctx.lineTo(mouse.x, mouse.y);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        function loop() {
            updatePhysics();
            draw();
            requestAnimationFrame(loop);
        }

        // Start
        initStrands();
        loop();

    </script>
</body>
</html>
